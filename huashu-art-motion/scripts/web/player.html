<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title><!--TITLE--></title>
<style>
:root{color-scheme:dark;background:#181914;color:#f1ede0;font:15px/1.5 system-ui,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(1080px,calc(100% - 32px));margin:18px auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-size:clamp(1rem,3vw,1.4rem);margin:0;overflow-wrap:anywhere}
#meta{color:#cec4a8;flex:none}
.stage{display:grid;place-items:center;background:#0e100c;border:1px solid #414438;border-radius:8px;overflow:hidden}
canvas{display:block;width:auto;height:auto;max-width:100%;max-height:72vh;object-fit:contain}
.controls{display:grid;grid-template-columns:auto minmax(30px,1fr) auto;align-items:center;gap:12px;margin:12px 0}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
button,a,select{font:inherit;padding:7px 13px;border:1px solid #5d6052;border-radius:5px;color:inherit;background:#2d3027}
button:disabled{opacity:.45}
button:enabled,a{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f3d77b;outline-offset:3px}
#play,#record{background:#f0d68a;color:#272312;border-color:#f0d68a}
#chapter{max-width:100%;cursor:pointer}
#scrub{min-width:0;width:100%;accent-color:#f0d68a}
#position{font-variant-numeric:tabular-nums;font-size:.9rem}
#status{color:#cec4a8;margin:9px 0 0;min-height:1.5em;overflow-wrap:anywhere}
.alpha canvas{background:repeating-conic-gradient(#d9d9d9 0% 25%,#f5f5f5 0% 50%) 50%/20px 20px}
</style>
</head>
<body>
<main>
<header><h1><!--TITLE--></h1><span id="meta"></span></header>
<div class="stage"><canvas id="c" aria-label="动画画面"></canvas></div>
<div class="controls">
<button id="play" type="button" disabled>播放</button>
<input id="scrub" type="range" min="0" max="1" value="0" step="any" aria-label="播放进度" disabled>
<output id="position" for="scrub">0.00 秒</output>
</div>
<div class="actions">
<select id="chapter" aria-label="选择分镜" hidden></select>
<button id="record" type="button" disabled>导出视频</button>
<button id="png" type="button" disabled>保存当前帧 PNG</button>
<a id="download" hidden>下载视频</a>
</div>
<p id="status" role="status" aria-live="polite">正在加载画面与字体…</p>
<noscript>请在启用 JavaScript 的浏览器中打开该文件。</noscript>
</main>
<!--LICENSES-->
<!--SCRIPTS-->
</body>
</html>
